<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{{title}}</title>
<meta name="description" content="{{description}}"/>
<link rel="canonical" href="{{site}}{{path}}"/>
<!-- Open Graph / Twitter -->
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="WA Coexistence"/>
<meta property="og:title" content="{{title}}"/>
<meta property="og:description" content="{{description}}"/>
<meta property="og:url" content="{{site}}{{path}}"/>
<meta property="og:image" content="{{site}}/assets/og.png"/>
<meta property="og:image:width" content="2148"/>
<meta property="og:image:height" content="928"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="{{title}}"/>
<meta name="twitter:description" content="{{description}}"/>
<meta name="twitter:image" content="{{site}}/assets/og.png"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<!-- Tailwind CSS, configured with the same theme as github.com/pocha/mudbot (Watobot) for visual consistency across our sites -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/gh/pocha/mudbot@main/public/assets/theme.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/pocha/mudbot@main/public/assets/theme.css"/>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col">
