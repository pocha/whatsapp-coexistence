<!-- The window in the onboarding flow: the shared tabs (partial ai-tool-tabs) inside a dialog. -->
<dialog id="ai-dialog" class="bg-white border border-outline-variant rounded-xl shadow-xl p-6 w-[92vw] max-w-3xl m-auto text-left backdrop:bg-black/50">
  <div class="flex justify-between items-start gap-4 mb-2">
    <p class="section-title text-on-surface">Show steps to connect</p>
    <button id="ai-close" type="button" aria-label="Close" class="text-on-surface-variant hover:text-on-surface text-2xl leading-none">&times;</button>
  </div>
  <!--#include partial="ai-tool-tabs"-->
</dialog>
