<!--#var title="Dashboard — WA Coexistence"-->
<!--#var description="Manage your onboarded WhatsApp numbers and activate coexistence for new ones."-->
<!--#include partial="head"-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@29.5/dist/css/intlTelInput.css"/>
<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@29.5/dist/js/intlTelInput.min.js"></script>
<!--#include partial="header"-->

  <script>
    // While the app waits for Meta's approval, visitors go to the landing page's waitlist. The
    // dashboard stays reachable on localhost, and anywhere after opening it once
    // with ?preview=1 (remembered in this browser).
    (function () {
      var open = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      try {
        if (new URLSearchParams(location.search).get('preview') === '1') localStorage.setItem('watobot_preview', '1');
        open = open || localStorage.getItem('watobot_preview') === '1';
      } catch (e) {}
      if (!open) location.replace('/?join-waitlist=true');
    })();
  </script>

  <div class="flex w-full flex-1">
    <!--#include partial="waba-sidebar"-->

    <section class="flex-1 min-w-0 px-gutter md:px-10 py-12">
    <div class="max-w-4xl mx-auto flex flex-col gap-6">

      <!-- Signed-out view -->
      <div id="signed-out" class="hidden card p-8 max-w-xl mx-auto w-full">
        <p class="section-title text-on-surface mb-2">Sign in to continue</p>

        <div id="phone-step" class="flex flex-col gap-3">
          <label class="font-label-md text-label-md text-on-surface-variant" for="phone-input">WhatsApp number</label>
          <input id="phone-input" type="tel" class="w-full px-4 py-2 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all disabled:opacity-50"/>
          <button id="send-otp-btn" class="self-start rounded-xl bg-primary text-on-primary px-6 py-3 font-label-md text-label-md font-bold hover:opacity-90 active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100">Send code on Whatsapp</button>
        </div>

        <div id="code-step" class="hidden flex flex-col gap-3 mt-4">
          <label class="font-label-md text-label-md text-on-surface-variant" for="code-input">6-digit code</label>
          <input id="code-input" type="text" inputmode="numeric" placeholder="123456" class="w-full px-4 py-2 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"/>
          <button id="verify-otp-btn" class="self-start rounded-xl bg-primary text-on-primary px-6 py-3 font-label-md text-label-md font-bold hover:opacity-90 active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100">Verify &amp; sign in</button>
        </div>

        <p class="text-on-surface-variant font-body-md text-sm mt-3" id="login-status"></p>
      </div>

      <!-- Signed-in view -->
      <div id="signed-in" class="hidden flex flex-col gap-6">
        <div class="flex justify-between items-center gap-4">
          <h1 class="font-headline-lg text-headline-lg text-on-surface">Your WABAs</h1>
          <a href="/dashboard/waba.html" class="rounded-xl bg-primary-container text-on-primary-container px-6 py-3 font-label-md text-label-md font-bold hover:opacity-90 active:scale-95 transition-all whitespace-nowrap">Onboard new WABA</a>
        </div>

        <div id="waba-cards" class="flex flex-col gap-4"></div>
        <p id="waba-cards-empty" class="hidden text-on-surface-variant font-body-md">No WABAs onboarded yet.</p>
      </div>
    </div>
    </section>
  </div>

  <script type="module" src="/dashboard/app.js"></script>

<!--#include partial="footer"-->
